# Crawl4AI HTTP API for desk crawl skills.
# Set CRAWL4AI_API_TOKEN; mirror it in Hermes / skill env.
services:
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    ports:
      - "127.0.0.1:11235:11235"
    volumes:
      - ./crawl4ai-data:/tmp/crawl4ai
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN}
    mem_limit: 1280m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:11235/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
