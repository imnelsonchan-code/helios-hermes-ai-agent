# Reports portal (nginx). Publish inbox markdown via sync_reports_www.sh.
# Create ./www and ./archive on the host before first start.
services:
  reports-server:
    image: nginx:alpine
    container_name: reports-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      # Loopback default (LAN exposure is opt-in — set REPORTS_BIND=0.0.0.0).
      - "${REPORTS_BIND:-127.0.0.1}:8080:80"
    volumes:
      - ./www:/usr/share/nginx/html/reports:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - reports-net

networks:
  reports-net:
    driver: bridge
