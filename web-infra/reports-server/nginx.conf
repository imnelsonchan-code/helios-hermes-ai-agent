server {
    listen 80;
    server_name _;
    server_tokens off;

    charset utf-8;

    add_header X-Content-Type-Options nosniff always;

    location = / {
        return 301 $scheme://$http_host/reports/;
    }

    location = /report {
        return 301 $scheme://$http_host/reports/;
    }
    location = /report/ {
        return 301 $scheme://$http_host/reports/;
    }

    # today/ links go stale after each 30-min sync — always revalidate.
    add_header Cache-Control "no-cache" always;

    location /reports/ {
        alias /usr/share/nginx/html/reports/;
        index index.html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /reports/today/ {
        alias /usr/share/nginx/html/reports/today/;
        index index.html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
