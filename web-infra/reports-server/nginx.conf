server {
    listen 80;
    server_name _;

    charset utf-8;

    location = / {
        return 301 $scheme://$http_host/reports/;
    }

    location = /report {
        return 301 $scheme://$http_host/reports/;
    }
    location = /report/ {
        return 301 $scheme://$http_host/reports/;
    }

    location /reports/ {
        alias /usr/share/nginx/html/reports/;
        index index.html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /reports/today/ {
        alias /usr/share/nginx/html/reports/today/;
        index index.html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
